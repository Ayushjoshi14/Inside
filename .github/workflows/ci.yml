name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests (FastAPI & Razorpay)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: .
          APP_ENV: test
          DEBUG: "True"
          RAZORPAY_KEY_ID: rzp_test_Tlj9Zi5CuxhGVM
          RAZORPAY_KEY_SECRET: fN44Rom7R3yVrrEQhBUv4WpI
          JWT_SECRET_KEY: inside-ci-jwt-secret-key-testing-only
        run: |
          python -m pytest backend/tests/ -v

  flutter-tests:
    name: Flutter Tests & Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Code Formatting & Lints
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        run: flutter test --coverage
